name: CMake Build (Windows)

on:
  push:
    branches: [ "goo-engine-main" ]
  pull_request:
    branches: [ "goo-engine-main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 240 # Compilações no Windows podem ser mais lentas

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar ambiente MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
        # O Windows usa o compilador da Microsoft (MSVC). Esta action configura
        # as variáveis de ambiente automaticamente para o CMake e Ninja acharem
        # o compilador cl.exe.

      - name: make update (baixa libs pré-compiladas e addons)
        shell: cmd
        run: make update
        # No Windows, o "make update" baixa a pasta "lib/win64_vc15" via SVN.
        # Essa pasta já contém o OpenImageIO e todas as dependências compiladas.
        # Isso evita o erro de compilação do OIIO que você estava tendo no Linux.

      - name: Configurar CMake
        shell: cmd
        run: |
          cmake -S . -B build -G Ninja ^
            -C build_files\cmake\config\blender_lite.cmake ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DWITH_COMPILER_CCACHE=OFF
        # Nota: Usamos "shell: cmd" no Windows para garantir que o "^" funcione
        # como quebra de linha corretamente. O CCACHE é desativado pois não
        # vem configurado por padrão no Windows do GitHub Actions.

      - name: Compilar
        shell: cmd
        run: cmake --build build --parallel %NUMBER_OF_PROCESSORS%
        
      # Opcional: Se você quiser fazer o upload do .exe gerado para baixar
      - name: Upload do Executável
        uses: actions/upload-artifact@v4
        with:
          name: goo-engine-windows
          # O executável do Blender/Goo-Engine geralmente é gerado em:
          # build\bin\Release\blender.exe (ou goo-engine.exe, dependendo do projeto)
          path: |
            build/bin/Release/*.exe
            build/bin/Release/*.dll
