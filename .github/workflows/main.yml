name: CMake Build (Windows)

on:
  push:
    branches: [ "goo-engine-main" ]
  pull_request:
    branches: [ "goo-engine-main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 240 # Builds do Windows podem demorar mais

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
        # Resolve o erro "Python not found". O Blender exige o 3.11.

      - name: Instalar SVN (necessário para baixar as libs do Windows)
        shell: pwsh
        run: choco install -y sliksvn --no-progress
        # No Windows, o script usa o comando 'svn' para baixar as libs.

      - name: Aplicar config Lite (para acelerar a compilação)
        shell: cmd
        run: copy /Y build_files\cmake\config\blender_lite.cmake build_files\cmake\config\blender_release.cmake
        # O make.bat usa o blender_release.cmake por padrão.
        # Isso substitui a config pesada pela lite automaticamente.

      - name: Baixar libs e atualizar (make.bat update)
        shell: cmd
        run: make.bat update
        # Usa o script nativo do Windows, que não dá o erro de VS not found.

      - name: Compilar (make.bat)
        shell: cmd
        run: make.bat
        # O make.bat encontra o Visual Studio sozinho, configura o CMake 
        # e compila com o Ninja.
        
      - name: Upload do Executável
        uses: actions/upload-artifact@v4
        with:
          name: goo-engine-windows
          # O executável e as DLLs são gerados nesta pasta:
          path: |
            build/bin/Release/*.exe
            build/bin/Release/*.dll
            build/bin/Release/*.py
            build/bin/Release/datafiles
