name: CMake Build (Windows)

# Coloque este arquivo em: .github/workflows/main.yml

on:
  push:
    branches: [ "goo-engine-main" ]
  pull_request:
    branches: [ "goo-engine-main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          path: src
        # Checkout em "src" de propósito: o make_update.py baixa as libs
        # pré-compiladas para "../lib" (pasta irmã da raiz do repo).

      - name: Cache das libs pré-compiladas
        uses: actions/cache@v4
        with:
          path: lib
          key: windows-libs-v1
          restore-keys: |
            windows-libs-
        # As libs pré-compiladas têm alguns GB e raramente mudam — cachear
        # evita baixar tudo de novo a cada run. Se precisar forçar um
        # download limpo, suba a versão da key (v1 -> v2).

      - name: Garantir que o svn está disponível
        shell: bash
        run: command -v svn || choco install svn -y

      - name: Configurar ambiente do Visual Studio
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Baixar libs pré-compiladas (checkout esparso, sem o llvm)
        working-directory: src
        shell: bash
        run: |
          set -e
          LIBDIR="../lib/win64_vc15"
          SVN_URL="https://svn.blender.org/svnroot/bf-blender/trunk/lib/win64_vc15"

          mkdir -p ../lib

          if [ ! -d "$LIBDIR/.svn" ]; then
            svn checkout --non-interactive --depth=immediates "$SVN_URL" "$LIBDIR"
          fi

          # WITH_LLVM está OFF no preset lite (só é usado pelo OSL/Cycles,
          # que também estão desligados). O llvm é de longe o maior
          # componente do pacote e é o que mais facilmente estoura o rate
          # limit (HTTP 429) do svn.blender.org. Excluindo ele explicitamente:
          svn update --non-interactive --set-depth=exclude "$LIBDIR/llvm" 2>/dev/null || true

          for i in 1 2 3 4 5 6; do
            svn cleanup "$LIBDIR" || true
            if svn update --non-interactive --set-depth=infinity "$LIBDIR"; then
              break
            fi
            echo "svn update falhou (tentativa $i/6), provavelmente rate limit (HTTP 429). Aguardando..."
            sleep $((i * 45))
          done

      - name: make update (addons/scripts/assets)
        working-directory: src
        shell: bash
        run: python build_files/utils/make_update.py
        # No Windows a plataforma já é detectada automaticamente pelo script
        # (não existe uma flag "--use-windows-libraries"). A pasta de libs já
        # existe (baixamos ela manualmente acima), então isso só cuida do
        # resto: addons, scripts e assets. O Python já vem embutido no
        # pacote de libs pré-compiladas, não precisa instalar à parte.

      - name: Configurar CMake
        working-directory: src
        shell: pwsh
        # Usando pwsh (não bash) aqui de propósito: com "shell: bash" no
        # Windows, o Git Bash acaba colocando /usr/bin/link na frente do
        # link.exe do MSVC no PATH, quebrando o build (é um problema
        # conhecido e documentado da própria action msvc-dev-cmd).
        run: cmake -S . -B build -G Ninja -C build_files/cmake/config/blender_lite.cmake -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        working-directory: src
        shell: pwsh
        run: cmake --build build --parallel

      - name: Empacotar release
        working-directory: src
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ..\dist | Out-Null
          Compress-Archive -Path build\bin\* -DestinationPath ..\dist\goo-engine-windows-x86_64.zip
        # O ninja já deixa o executável pronto pra rodar em build/bin
        # (binário + datafiles + scripts), sem precisar de "install" à parte.

      - name: Upload do pacote
        uses: actions/upload-artifact@v4
        with:
          name: goo-engine-windows-x86_64
          path: dist/goo-engine-windows-x86_64.zip
          retention-days: 14
