name: CMake Build (Linux)

# Coloque este arquivo em: .github/workflows/main.yml

on:
  push:
    branches: [ "goo-engine-main" ]
  pull_request:
    branches: [ "goo-engine-main" ]
  workflow_dispatch:

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          path: src
        # Checkout em "src" de propósito: o make_update.py baixa as libs
        # pré-compiladas para "../lib" (pasta irmã da raiz do repo).

      - name: Cache das libs pré-compiladas e do ccache
        uses: actions/cache@v4
        with:
          path: |
            lib
            .ccache
          key: linux-libs-v2
          restore-keys: |
            linux-libs-
        # As libs pré-compiladas têm alguns GB e raramente mudam — cachear
        # evita baixar tudo de novo a cada run. Se precisar forçar um
        # download limpo (ex: mudou algo na exclusão do llvm), suba a versão
        # da key (v2 -> v3).

      - name: Instalar Python 3.11 (única versão suportada pelo CMake)
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y python3.11 python3.11-dev python3.11-venv
        # As libs pré-compiladas do Linux não incluem Python — o projeto
        # espera que o 3.11 venha do sistema mesmo.

      - name: Instalar ferramentas de build
        working-directory: src
        run: |
          sudo apt-get update
          sudo python3 build_files/build_environment/install_linux_packages.py --all
          sudo apt-get install -y ccache subversion

      - name: Baixar libs pré-compiladas (checkout esparso, sem o llvm)
        working-directory: src
        run: |
          set -e
          LIBDIR="../lib/linux_x86_64_glibc_228"
          SVN_URL="https://svn.blender.org/svnroot/bf-blender/trunk/lib/linux_x86_64_glibc_228"

          mkdir -p ../lib

          if [ ! -d "$LIBDIR/.svn" ]; then
            svn checkout --non-interactive --depth=immediates "$SVN_URL" "$LIBDIR"
          fi

          # WITH_LLVM está OFF no preset lite (só é usado pelo OSL/Cycles,
          # que também estão desligados). O llvm é de longe o maior
          # componente do pacote e foi o que estourou o rate limit (HTTP 429)
          # do svn.blender.org. Excluindo ele explicitamente:
          svn update --non-interactive --set-depth=exclude "$LIBDIR/llvm" 2>/dev/null || true

          for i in 1 2 3 4 5 6; do
            svn cleanup "$LIBDIR" || true
            if svn update --non-interactive --set-depth=infinity "$LIBDIR"; then
              break
            fi
            echo "svn update falhou (tentativa $i/6), provavelmente rate limit (HTTP 429). Aguardando..."
            sleep $((i * 45))
          done

      - name: make update (addons/scripts/assets)
        working-directory: src
        run: python3 build_files/utils/make_update.py --use-linux-libraries
        # A pasta de libs já existe (baixamos ela manualmente acima), então
        # esse passo só cuida do resto: addons, scripts e assets.

      - name: Configurar CMake
        working-directory: src
        run: |
          cmake -S . -B build -G Ninja \
            -C build_files/cmake/config/blender_lite.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_COMPILER_CCACHE=ON

      - name: Compilar
        working-directory: src
        run: cmake --build build --parallel "$(nproc)"
