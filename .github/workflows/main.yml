name: CMake Build (Linux)

# Coloque este arquivo em: .github/workflows/main.yml

on:
  push:
    branches: [ "goo-engine-main" ]
  pull_request:
    branches: [ "goo-engine-main" ]
  workflow_dispatch:

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          path: src
        # Checkout em "src" de propósito: o make_update.py baixa as libs
        # pré-compiladas para "../lib" (pasta irmã da raiz do repo).

      - name: Cache das libs pré-compiladas e do ccache
        uses: actions/cache@v4
        with:
          path: |
            lib
            .ccache
          key: linux-libs-v1
          restore-keys: |
            linux-libs-
        # As libs pré-compiladas (OIIO, OpenColorIO, OpenEXR etc.) têm alguns
        # GB e raramente mudam — cachear evita baixar tudo de novo a cada run.
        # Se um dia precisar forçar um download limpo, mude "v1" pra "v2".

      - name: Instalar Python 3.11 (única versão suportada pelo CMake)
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y python3.11 python3.11-dev python3.11-venv
        # As libs pré-compiladas do Linux não incluem Python — o projeto
        # espera que o 3.11 venha do sistema mesmo.

      - name: Instalar ferramentas de build
        working-directory: src
        run: |
          sudo apt-get update
          sudo python3 build_files/build_environment/install_linux_packages.py --all
          sudo apt-get install -y ccache subversion
        # Continua necessário: compiladores, cmake, ninja, svn, e libs que só
        # podem vir do sistema mesmo (X11, Wayland, DBus, ALSA/Pulse etc.).

      - name: make update (baixa libs pré-compiladas + addons/assets)
        working-directory: src
        run: python3 build_files/utils/make_update.py --use-linux-libraries

      - name: Configurar CMake
        working-directory: src
        run: |
          cmake -S . -B build -G Ninja \
            -C build_files/cmake/config/blender_lite.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_COMPILER_CCACHE=ON

      - name: Compilar
        working-directory: src
        run: cmake --build build --parallel "$(nproc)"
