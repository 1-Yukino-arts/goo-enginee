name: CMake Build (Windows)

# Coloque este arquivo em: .github/workflows/main.yml

on:
  push:
    branches: [ "goo-engine-main" ]
  pull_request:
    branches: [ "goo-engine-main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 240

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          path: src
        # Checkout em "src" de propósito: o make_update.py baixa as libs
        # pré-compiladas para "../lib" (pasta irmã da raiz do repo).

      - name: Cache das libs pré-compiladas
        uses: actions/cache@v4
        with:
          path: lib
          key: windows-libs-v3
          restore-keys: |
            windows-libs-
        # As libs pré-compiladas têm alguns GB e raramente mudam — cachear
        # evita baixar tudo de novo a cada run. Se precisar forçar um
        # download limpo, suba a versão da key (v1 -> v2).

      - name: Garantir que o svn está disponível
        shell: pwsh
        run: |
          if (-not (Get-Command svn -ErrorAction SilentlyContinue)) {
            # O pacote "svn" do choco (win32svn) instala num caminho
            # imprevisível via MSI. Usando "sliksvn" com /InstallDir
            # explícito pra saber exatamente onde o svn.exe vai parar.
            choco install sliksvn -y --no-progress --package-parameters="/InstallDir=C:\SVN"
          }
          # O choco não propaga o PATH pros próximos steps sozinho — cada
          # step é um processo novo. Adicionando manualmente via
          # $GITHUB_PATH (não tem problema se algum caminho não existir):
          Add-Content -Path $env:GITHUB_PATH -Value "C:\SVN\bin"
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\SlikSvn\bin"
          Add-Content -Path $env:GITHUB_PATH -Value "C:\ProgramData\chocolatey\bin"

      - name: Configurar ambiente do Visual Studio
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Baixar libs pré-compiladas (checkout esparso, sem componentes não usados)
        working-directory: src
        shell: bash
        run: |
          set -e
          SVN_BASE="https://svn.blender.org/svnroot/bf-blender/trunk/lib/"
          mkdir -p ../lib

          fetch_sparse() {
            local dir="$1" url="$2"
            if [ ! -d "$dir/.svn" ]; then
              svn checkout --non-interactive --depth=immediates "$url" "$dir"
            fi
          }

          retry_update() {
            local dir="$1"
            local max_attempts=8
            local i wait
            for ((i = 1; i <= max_attempts; i++)); do
              svn cleanup "$dir" || true
              if svn update --non-interactive --set-depth=infinity "$dir"; then
                return 0
              fi
              wait=$((i * 30))
              if [ "$wait" -gt 180 ]; then wait=180; fi
              echo "svn update falhou em $dir (tentativa $i/$max_attempts), provavelmente rate limit (HTTP 429). Aguardando ${wait}s..."
              sleep "$wait"
            done
            return 1
          }

          LIBDIR="../lib/win64_vc15"
          fetch_sparse "$LIBDIR" "${SVN_BASE}win64_vc15"

          # Auditei build_files/cmake/config/blender_lite.cmake (todas as
          # flags WITH_* que estão OFF) e excluí os componentes grandes e
          # autocontidos correspondentes, que não são usados por esse preset
          # nem são dependência de nada que continua ligado (JPEG/PNG/ZLIB/
          # Zstd/Epoxy/Freetype/OpenImageIO/OpenEXR/Python/etc. permanecem).
          EXCLUDE_DIRS=(
            llvm usd materialx opensubdiv openvdb embree osl alembic
            opencollada draco openimagedenoise xr-openxr-sdk openxr-sdk
            boost tbb ffmpeg opencolorio gmp fftw3 sndfile vorbis opus vpx
            theora lame potrace pugixml haru quadriflow nanovdb level-zero
          )
          for d in "${EXCLUDE_DIRS[@]}"; do
            svn update --non-interactive --set-depth=exclude "$LIBDIR/$d" 2>/dev/null || true
          done

          # Atualiza cada subpasta restante SEPARADAMENTE, com uma pausa
          # entre elas, em vez de um "svn update" único pra árvore inteira.
          # O servidor parece limitar pela taxa SUSTENTADA de requisições
          # (travou de novo depois de ~17min contínuos mesmo já excluindo os
          # componentes grandes), então quebrar em pedaços com respiro entre
          # eles ajuda mais do que só esperar depois de falhar.
          for entry in "$LIBDIR"/*/; do
            [ -d "${entry}.svn" ] || continue
            echo "Atualizando: $entry"
            retry_update "$entry"
            sleep 8
          done
          retry_update "$LIBDIR"

          # Buscando também os "assets" aqui (com o mesmo retry), pra que o
          # make_update.py não precise baixar nada por conta própria depois
          # — o passe de update interno dele não tem proteção contra 429.
          ASSETSDIR="../lib/assets"
          fetch_sparse "$ASSETSDIR" "${SVN_BASE}assets"
          sleep 8
          retry_update "$ASSETSDIR"

      - name: make update (addons/scripts)
        working-directory: src
        shell: bash
        run: python build_files/utils/make_update.py
        # Libs pré-compiladas e assets já estão sincronizados pelo passo
        # anterior (com retry). Esse passo só cuida de addons/scripts via
        # git, além de conferir rapidamente que lib/assets estão em dia —
        # como já estão, isso deve ser praticamente instantâneo.

      - name: Configurar CMake
        working-directory: src
        shell: pwsh
        # Usando pwsh (não bash) aqui de propósito: com "shell: bash" no
        # Windows, o Git Bash acaba colocando /usr/bin/link na frente do
        # link.exe do MSVC no PATH, quebrando o build (é um problema
        # conhecido e documentado da própria action msvc-dev-cmd).
        run: cmake -S . -B build -G Ninja -C build_files/cmake/config/blender_lite.cmake -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        working-directory: src
        shell: pwsh
        run: cmake --build build --parallel

      - name: Empacotar release
        working-directory: src
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ..\dist | Out-Null
          Compress-Archive -Path build\bin\* -DestinationPath ..\dist\goo-engine-windows-x86_64.zip
        # O ninja já deixa o executável pronto pra rodar em build/bin
        # (binário + datafiles + scripts), sem precisar de "install" à parte.

      - name: Upload do pacote
        uses: actions/upload-artifact@v4
        with:
          name: goo-engine-windows-x86_64
          path: dist/goo-engine-windows-x86_64.zip
          retention-days: 14
          name: goo-engine-windows-x86_64
          path: dist/goo-engine-windows-x86_64.zip
          retention-days: 14
