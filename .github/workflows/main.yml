name: CMake Build (Windows)

on:
  push:
    branches: [ "goo-engine-main" ]
  pull_request:
    branches: [ "goo-engine-main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 240

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Instalar SVN e Ninja
        shell: pwsh
        run: |
          choco install -y sliksvn --no-progress
          choco install -y ninja --no-progress
        # Instala o SVN para baixar as libs e o Ninja para acelerar a compilação

      - name: Configurar ambiente MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
        # Esta action configura o compilador do Visual Studio (cl.exe) perfeitamente

      - name: Baixar libs pré-compiladas (make update via Python)
        shell: cmd
        run: python build_files\utils\make_update.py
        # Em vez de usar make.bat, chamamos o script Python diretamente.
        # Isso usa o Python 3.11 que acabamos de instalar e evita o erro.

      - name: Configurar CMake
        shell: cmd
        run: |
          cmake -S . -B build -G Ninja ^
            -C build_files\cmake\config\blender_lite.cmake ^
            -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        shell: cmd
        run: cmake --build build --parallel %NUMBER_OF_PROCESSORS%
        
      - name: Upload do Executável
        uses: actions/upload-artifact@v4
        with:
          name: goo-engine-windows
          path: |
            build/bin/Release/*.exe
            build/bin/Release/*.dll
            build/bin/Release/*.py
            build/bin/Release/datafiles
